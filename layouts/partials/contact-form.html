<form action="https://formsubmit.co" method="POST" class="contact-form">
  
  <!-- 1. TYPE YOUR EMAIL IN THE VALUE BOX BELOW -->
  <input type="hidden" name="_email" value="plittlebury99@gmail.com">

  <!-- FormSubmit Configuration Fields -->
  <input type="hidden" name="_next" value="{{ "confirmation/" | absURL }}">
  <input type="hidden" name="_captcha" value="false">

  <!-- Form Fields -->
  <div class="form-group">
    <label for="name">Your Name</label>
    <input type="text" id="name" name="name" placeholder="John Doe" required>
  </div>

  <div class="form-group">
    <label for="email">Email Address</label>
    <input type="email" id="email" name="email" placeholder="john@example.com" required>
  </div>

  <div class="form-group">
    <label for="message">Message</label>
    <textarea id="message" name="message" rows="5" placeholder="How can I help you?" required></textarea>
  </div>

  <button type="submit" class="submit-btn">Send Message</button>
</form>
