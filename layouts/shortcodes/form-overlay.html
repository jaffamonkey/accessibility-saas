<!-- Button to open the overlay -->
<button id="openFormBtn" class="form-trigger-btn">Contact Us</button>

<!-- The Overlay Backdrop -->
<div id="formOverlay" class="overlay-backdrop" style="display: none;">
  <!-- The Modal Box -->
  <div class="overlay-content">
    <button id="closeFormBtn" class="close-btn">&times;</button>
    
    <h3>Send a Message</h3>
    <!-- Change action URL to your service (e.g., Formspree or Netlify) -->
    <form action="https://formspree.io" method="POST">
      <input type="text" name="name" placeholder="Your Name" required>
      <input type="email" name="email" placeholder="Your Email" required>
      <textarea name="message" placeholder="Your Message" required></textarea>
      <button type="submit">Submit</button>
    </form>
  </div>
</div>

<script>
  const overlay = document.getElementById('formOverlay');
  const openBtn = document.getElementById('openFormBtn');
  const closeBtn = document.getElementById('closeFormBtn');

  // Show overlay
  openBtn.addEventListener('click', () => overlay.style.display = 'flex');

  // Hide overlay via close button
  closeBtn.addEventListener('click', () => overlay.style.display = 'none');

  // Hide overlay if user clicks outside the modal content box
  window.addEventListener('click', (e) => {
    if (e.target === overlay) overlay.style.display = 'none';
  });
</script>
